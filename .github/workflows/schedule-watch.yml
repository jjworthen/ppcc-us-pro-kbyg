name: PPCC schedule watcher

on:
  workflow_dispatch:
    inputs:
      online:
        description: "Fetch official source URLs"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# Hosted GitHub Actions runners are disabled for the current managed account.
# Add a cron schedule after hosted or self-hosted runners are available.

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run schedule watcher
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.online }}" = "false" ]; then
            npm run watch:schedule
          else
            npm run watch:schedule -- --online
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppcc-schedule-watch-report
          path: automation/reports/schedule-watch-latest.md

      - name: Create or update watcher issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "PPCC schedule watcher report";
            const marker = "<!-- ppcc-schedule-watch -->";
            const report = fs.readFileSync("automation/reports/schedule-watch-latest.md", "utf8");
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => issue.title === title && issue.body?.includes(marker));
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
