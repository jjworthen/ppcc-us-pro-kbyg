name: Validate guide

on:
  workflow_dispatch:

# Hosted GitHub Actions runners are disabled for the current managed account.
# Keep this workflow manual until hosted or self-hosted runners are available.

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate static guide
        run: npm run validate:guide
